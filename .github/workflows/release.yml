name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ref_sha: ${{ steps.source.outputs.ref_sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and validate tag
        id: source
        env:
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          tag="$EVENT_TAG"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
              || { printf 'release tag must match vX.Y.Z\n' >&2; exit 1; }
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" main
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          ref_sha="$(git rev-parse "refs/tags/$tag")"
          git checkout --detach "$sha"
          ./tools/validate_release.sh git "$tag" "$sha" origin/main .
          ./tools/validate_release.sh files "$tag" sudokuplus.koplugin/_meta.lua CHANGELOG.md release-notes.md
          printf 'sha=%s\nref_sha=%s\ntag=%s\n' "$sha" "$ref_sha" "$tag" >> "$GITHUB_OUTPUT"

      - name: Upload validated release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sudokuplus-release-metadata
          path: release-notes.md
          if-no-files-found: error
          retention-days: 3

  gates:
    name: Run release gates
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read

  publish:
    name: Publish verified artifacts
    needs: [resolve, gates]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sudokuplus-release-package
          path: release

      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sudokuplus-release-metadata
          path: release

      - name: Recheck checksum and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF_SHA: ${{ needs.resolve.outputs.ref_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          (cd release && sha256sum --check sudokuplus.koplugin.zip.sha256)
          remote_ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          [[ "$remote_ref_sha" == "$RELEASE_REF_SHA" ]] || { printf 'release tag moved\n' >&2; exit 1; }

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "$RELEASE_TAG" \
                  --notes-file release/release-notes.md
              gh release upload "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --clobber \
                  release/sudokuplus.koplugin.zip \
                  release/sudokuplus.koplugin.zip.sha256
          else
              gh release create "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --verify-tag \
                  --title "$RELEASE_TAG" \
                  --notes-file release/release-notes.md \
                  release/sudokuplus.koplugin.zip \
                  release/sudokuplus.koplugin.zip.sha256
          fi
