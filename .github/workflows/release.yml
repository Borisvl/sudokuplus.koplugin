name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Extract Changelog Section
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "Extracting release notes for version $VERSION from CHANGELOG.md..."
          
          # Extract section between "## [VERSION]" and next "## "
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## / { found=0 }
            found { print }
          ' CHANGELOG.md > release_notes.md || true

          if [[ ! -s release_notes.md ]]; then
            echo "Release $TAG for Sudoku+ (KOReader plugin)" > release_notes.md
          fi

          echo "Generated release notes ($(wc -l < release_notes.md) lines)."

      - name: Build Release Package
        run: ./tools/package_release.sh

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub. Updating notes and asset..."
            gh release edit "$TAG" --title "$TAG" --notes-file release_notes.md
            gh release upload "$TAG" dist/sudokuplus.koplugin.zip --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release_notes.md \
              dist/sudokuplus.koplugin.zip
          fi
